<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">

  <title>[INDEX_PAGE_TITLE, e.g. Fluency Standard | IELTS Speaking Academy]</title>
  <meta name="description" content="[INDEX_META_DESCRIPTION]">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="[INDEX_OG_TITLE]">
  <meta property="og:description" content="[INDEX_OG_DESCRIPTION]">
  <meta property="og:url" content="[SITE_URL]/index.html">
  <meta property="og:image" content="[OG_IMAGE_URL]">

  <!-- Favicon -->
  <link rel="icon" href="[FAVICON_PATH]" type="image/svg+xml">

  <!--
    FONTS: Preload above-the-fold fonts for LCP and layout stability.
    Self-hosting is recommended for Bangladesh mobile networks (subset to Latin, WOFF2).
    1) Self-hosted option: replace the href values below with your local /fonts/*.woff2 paths
       and uncomment the @font-face declarations at the top of styles.css.
    2) Google Fonts option: keep the stylesheet link below if not self-hosting.
  -->
  <link rel="preload" href="[FONT_INSTRUMENT_SERIF_WOFF2_URL]" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="[FONT_INTER_WOFF2_URL]" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="page-landing">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Header: Wordmark only, no navigation -->
  <header class="site-header site-header--minimal">
    <div class="container">
      <a class="wordmark" href="index.html">Fluency Standard</a>
    </div>
  </header>

  <!-- Main Hero: Headline, Video Facade, Primary Action -->
  <main id="main-content" class="landing-main">
    <section class="hero" aria-labelledby="hero-heading">
      <div class="container container--narrow">
        <h1 id="hero-heading" class="hero-headline reveal">[HEADLINE]</h1>

        <!--
          VIDEO FACADE
          Set data-video-type to "mp4" for a self-hosted MP4 file or "embed" for an iframe URL
          (e.g. Bunny Stream, Vimeo, or YouTube privacy-enhanced embed).
        -->
        <div
          class="video-frame reveal"
          data-video-facade
          data-video-type="mp4"
          data-video-src="[VIDEO_SRC_URL]"
          data-video-title="Fluency Standard introduction video"
        >
          <img
            class="video-poster"
            src="[VIDEO_POSTER_URL]"
            alt="[VIDEO_POSTER_ALT]"
            width="1280"
            height="720"
            loading="lazy"
            decoding="async"
          >
          <button
            type="button"
            class="video-play-btn"
            aria-label="Play video"
            data-video-play
          >
            <span class="video-play-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
                <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"></path>
              </svg>
            </span>
            <span class="video-play-label">Watch video</span>
          </button>
        </div>

        <div class="hero-cta-wrap reveal">
          <a class="btn btn-primary btn-hero" href="programs.html">
            [BUTTON TEXT, e.g. "Join our community"]
          </a>
          <p class="supporting-line">[SUPPORTING LINE]</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Quiet Footer -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">&copy; [YEAR] Fluency Standard. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
